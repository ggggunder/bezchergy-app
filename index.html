<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wood Coffee</title>
<meta name="description" content="Wood Coffee: замовте каву, чай чи десерт у Telegram перед виходом з дому і заберіть без черги.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Макет: на десктопі дві «трубки» поруч (гість і бариста, живий зв'язок), на телефоні застосунок на весь екран з перемикачем ролей.
   Мова бренду: кремовий фон, темний стікер з м'ятним текстом і нижньою кромкою, кільця зрізу дерева = вигляд чашки згори. */
:root{
  --bg:#F3ECE4; --surface:#FBF7F2; --surface-2:#EDE4D9; --sunk:#E6DCD0;
  --fg:#2D3A37; --fg-strong:#1C2523; --muted:#56625E;
  --mint:#A9E3C6; --mint-text:#2F6B53; --mint-soft:#DDF2E7;
  --sticker:#2D3A37; --on-sticker:#A9E3C6; --on-sticker-2:#DCE5E1; --edge:#182320;
  --line:rgba(45,58,55,.13); --line-strong:rgba(45,58,55,.24);
  --amber-bg:#F7E3B8; --amber-fg:#6B4A10; --red:#9E3A22; --red-bg:#F6DDD4;
  --cup:#FFFFFF; --cup-edge:rgba(45,58,55,.18); --sel-bg:#2D3A37; --sel-fg:#A9E3C6;
  --page:#E9E0D5; --frame:#1C2523;
  --f-display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --f-text:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-l:24px; --r-m:18px; --r-s:12px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#172120; --surface:#212C2A; --surface-2:#2A3634; --sunk:#11191800;
  --fg:#EEF2EE; --fg-strong:#FFFFFF; --muted:#B7C4BF;
  --mint:#A9E3C6; --mint-text:#A9E3C6; --mint-soft:#24413A;
  --sticker:#2D3A37; --on-sticker:#A9E3C6; --on-sticker-2:#DCE5E1; --edge:#0A100F;
  --line:rgba(238,242,238,.10); --line-strong:rgba(238,242,238,.2);
  --amber-bg:#3A3220; --amber-fg:#F0C987; --red:#F2A08A; --red-bg:#3A2420;
  --cup:#EDE6DC; --cup-edge:rgba(0,0,0,.35); --sel-bg:#A9E3C6; --sel-fg:#1C2523;
  --page:#0F1615; --frame:#050807; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#172120; --surface:#212C2A; --surface-2:#2A3634; --sunk:#11191800;
  --fg:#EEF2EE; --fg-strong:#FFFFFF; --muted:#B7C4BF;
  --mint:#A9E3C6; --mint-text:#A9E3C6; --mint-soft:#24413A;
  --sticker:#2D3A37; --on-sticker:#A9E3C6; --on-sticker-2:#DCE5E1; --edge:#0A100F;
  --line:rgba(238,242,238,.10); --line-strong:rgba(238,242,238,.2);
  --amber-bg:#3A3220; --amber-fg:#F0C987; --red:#F2A08A; --red-bg:#3A2420;
  --cup:#EDE6DC; --cup-edge:rgba(0,0,0,.35); --sel-bg:#A9E3C6; --sel-fg:#1C2523;
  --page:#0F1615; --frame:#050807; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
html,body{height:100%}
body{margin:0;background:var(--bg);overflow:hidden;color:var(--fg);font:15px/1.45 var(--f-text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--mint-text);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}

/* ───── застосунок ───── */
.app{position:relative;width:100%;height:100%;background:var(--bg);border-radius:40px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.tgbar{flex:none;height:92px;padding:50px 14px 0;display:flex;align-items:center;justify-content:space-between;font-size:14px;background:var(--bg);position:relative;z-index:5}
.tgbar .tg-x{color:var(--mint-text);font-weight:600;height:36px;padding:0 4px;display:flex;align-items:center;gap:6px}
.tgbar .tg-t{font-weight:700;color:var(--fg-strong);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.tgbar .tg-t small{font-weight:500;color:var(--muted);font-size:11.5px}
.tgbar .tg-m{width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;position:relative}
.view::-webkit-scrollbar{display:none}
.view-in{padding:4px 16px 140px;display:flex;flex-direction:column;gap:18px}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:8;pointer-events:none;display:flex;flex-direction:column;gap:10px;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.dock>*{pointer-events:auto}
.layer{position:absolute;inset:0;z-index:20;pointer-events:none}
.toasts{position:absolute;top:52px;left:10px;right:10px;z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}

/* логотип-стікер */
.logo{display:inline-flex;flex-direction:column;align-items:flex-start;position:relative;background:var(--sticker);color:var(--on-sticker);border-radius:12px;padding:9px 12px 7px;box-shadow:0 3px 0 var(--edge);font:600 15px/1 var(--f-display);letter-spacing:.06em}
.logo .l1{display:flex;align-items:center;gap:1px}
.logo .l1 svg{width:15px;height:15px}
.logo .top{position:absolute;top:-9px;left:31px;width:20px;height:20px;border-radius:50%;background:var(--sticker);display:grid;place-items:center}
.logo .top svg{width:15px;height:15px}
.logo .l2{letter-spacing:.12em;margin-top:3px;font-size:13px}

/* шапка меню */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.hello h2{margin:0;font:700 24px/1.12 var(--f-display);color:var(--fg-strong);text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--muted);font-size:14px}
.place{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;text-align:left;width:100%}
.place .pin{width:38px;height:38px;border-radius:12px;background:var(--mint-soft);color:var(--mint-text);display:grid;place-items:center;flex:none}
.place .t{flex:1;min-width:0}
.place b{display:block;font-weight:600;color:var(--fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place small{color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mint-text)}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,107,83,.45)}70%{box-shadow:0 0 0 7px rgba(47,107,83,0)}100%{box-shadow:0 0 0 0 rgba(47,107,83,0)}}

.again{background:var(--sticker);color:var(--on-sticker-2);border-radius:var(--r-l);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px 14px;align-items:center;box-shadow:0 4px 0 var(--edge)}
.again>button,.again>.go-btn{grid-column:1/-1}
.again .discs{display:flex;flex:none}
.again .discs svg{width:46px;height:46px}
.again .discs svg+svg{margin-left:-14px}
.again .t{flex:1;min-width:0}
.again small{color:var(--on-sticker);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.again b{display:block;font-weight:600;color:#fff;font-size:14.5px;line-height:1.3;margin-top:2px}
.again>button{height:46px;border-radius:14px;background:var(--mint);color:#1C2523;font-weight:700;font-size:15px}

.closed{background:var(--amber-bg);color:var(--amber-fg);border-radius:var(--r-m);padding:12px 14px;font-weight:600;font-size:14px}

.cats{position:sticky;top:0;z-index:4;margin:0 -16px;padding:8px 16px;background:var(--bg);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);font-weight:600;font-size:14px;color:var(--fg);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.chip small{font-weight:500;opacity:.75}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.sec-h h3{margin:0;font:700 18px/1.2 var(--f-display);color:var(--fg-strong)}
.sec-h span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);position:relative;text-align:left;min-width:0}
.card .ph{aspect-ratio:1;max-width:100%;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.card .ph svg{width:82%;height:82%}
.ph.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
:root[data-theme="dark"] .ph.skel::after{background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ph.skel::after{background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%)}}
@keyframes shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
.ph .skel-disc{width:70%;aspect-ratio:1;border-radius:50%;background:var(--sunk);border:2px dashed var(--line-strong)}
.card .tag{position:absolute;top:18px;left:18px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 8px;border-radius:999px;background:var(--sticker);color:var(--on-sticker);z-index:2}
.card h4{margin:0;font-weight:600;font-size:15px;line-height:1.25;color:var(--fg-strong)}
.card p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
.price{font-weight:700;color:var(--fg-strong);font-size:15px}
.price small{font-weight:500;color:var(--muted);font-size:12.5px}
.plus{width:44px;height:44px;border-radius:14px;background:var(--sticker);color:var(--on-sticker);display:grid;place-items:center;box-shadow:0 3px 0 var(--edge);transition:transform .12s,box-shadow .12s;flex:none}
.plus:active,.btn:active,.mainbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.qty-badge{position:absolute;top:18px;right:18px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--mint);color:#1C2523;font-weight:700;font-size:13px;display:grid;place-items:center;z-index:2}
.card.off{opacity:.55}
.card.off .plus{background:var(--surface-2);color:var(--muted);box-shadow:none}
.card .offlbl{font-size:12px;font-weight:600;color:var(--red)}

/* нижня док-панель */
.cartbar{display:flex;align-items:center;gap:12px;height:60px;border-radius:20px;background:var(--sticker);color:#fff;padding:0 8px 0 16px;box-shadow:0 4px 0 var(--edge),0 18px 30px -12px rgba(24,35,32,.5);text-align:left;width:100%}
.cartbar .cnt{width:30px;height:30px;border-radius:50%;background:var(--mint);color:#1C2523;font-weight:700;display:grid;place-items:center;font-size:14px}
.cartbar .t{flex:1;font-weight:600}
.cartbar .t small{display:block;font-weight:500;font-size:12px;color:var(--on-sticker-2);opacity:.85}
.cartbar .go{height:44px;padding:0 16px;border-radius:14px;background:var(--mint);color:#1C2523;font-weight:700;display:flex;align-items:center;gap:6px}
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;height:64px;box-shadow:0 12px 30px -16px rgba(24,35,32,.35)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tabbar button[aria-current="page"]{color:var(--fg-strong)}
.tabbar button[aria-current="page"] svg{color:var(--mint-text)}
.tabbar .dot{position:absolute;top:9px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--mint);color:#1C2523;font-size:11px;display:grid;place-items:center;padding:0 5px}
.mainbtn{height:56px;border-radius:18px;background:var(--sticker);color:var(--on-sticker);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 var(--edge),0 18px 30px -12px rgba(24,35,32,.5);width:100%;transition:transform .12s,box-shadow .12s,background .3s}
.mainbtn.mint{background:var(--mint);color:#1C2523}
.mainbtn[disabled]{opacity:.5;cursor:not-allowed}
.mainbtn .sum{opacity:.8;font-weight:600}

/* шит */
.scrim{position:absolute;inset:0;background:rgba(20,28,26,.45);pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);border-radius:28px 28px 0 0;pointer-events:auto;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:8px auto 0;flex:none}
.sheet-body{overflow-y:auto;padding:8px 16px 110px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet .close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;z-index:2;border:1px solid var(--line)}
.sheet .foot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;align-items:center}
.hero-disc{width:220px;height:220px;margin:6px auto 0;position:relative}
.hero-disc svg{width:100%;height:100%}
.item-h{display:flex;flex-direction:column;gap:6px}
.item-h h2{margin:0;font:700 24px/1.15 var(--f-display);color:var(--fg-strong)}
.item-h p{margin:0;color:var(--fg);font-size:15px}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;color:var(--muted);line-height:1.2}
.fact b{display:block;color:var(--fg-strong);font-size:14px}
.opt h5{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.size{border:1.5px solid var(--line-strong);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);transition:border-color .2s,background .2s}
.size svg{color:var(--fg)}
.size b{font-size:14px;color:var(--fg-strong)}
.size[aria-pressed="true"]{border-color:var(--sel-bg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--sel-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{height:38px;font-size:13.5px}
.compo{font-size:13.5px;color:var(--muted);background:var(--surface);border-radius:var(--r-m);padding:12px 14px;border:1px solid var(--line)}
.compo b{color:var(--fg)}
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;height:56px;flex:none}
.stepper button{width:44px;height:100%;display:grid;place-items:center;color:var(--fg-strong)}
.stepper span{min-width:20px;text-align:center;font-weight:700}
.stepper.sm{height:40px;border-radius:12px}
.stepper.sm button{width:34px}
.ctrl .stepper.sm button{width:30px}

/* кошик */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mint-text);font-weight:600;height:40px}
.title{margin:0;font:700 26px/1.1 var(--f-display);color:var(--fg-strong)}
.line-item{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r-m);padding:10px 12px;border:1px solid var(--line)}
.line-item svg.d{width:54px;height:54px;flex:none}
.line-item .t{flex:1;min-width:0}
.line-item b{display:block;font-weight:600;color:var(--fg-strong);font-size:14.5px}
.line-item small{color:var(--muted);font-size:12.5px;display:block}
.line-item .p{font-weight:700;font-size:14px;color:var(--fg-strong);margin-top:2px}
.block{background:var(--surface);border-radius:var(--r-l);padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.block h4{margin:0;font:700 16px/1.2 var(--f-display);color:var(--fg-strong)}
.block .sub{color:var(--muted);font-size:13px;margin-top:-6px}
.when{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.when button{height:56px;border-radius:14px;border:1.5px solid var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-weight:700;font-size:15px;color:var(--fg-strong)}
.when button small{font-weight:500;font-size:11px;color:var(--muted)}
.when button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.when button[aria-pressed="true"] small{color:inherit;opacity:.8}
.timeline{display:flex;align-items:center;gap:10px;background:var(--mint-soft);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--fg)}
.timeline b{color:var(--mint-text)}
.radio{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px solid var(--line);text-align:left;width:100%}
.radio[aria-checked="true"]{border-color:var(--sel-bg)}
.radio .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-weight:700;font-size:12px}
.radio .t{flex:1}
.radio .t b{display:block;font-size:14.5px;font-weight:600;color:var(--fg-strong)}
.radio .t small{color:var(--muted);font-size:12.5px}
.radio .o{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center}
.radio[aria-checked="true"] .o{border-color:var(--sel-bg);background:var(--sel-bg)}
.radio[aria-checked="true"] .o::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sel-fg)}
.switch-row{display:flex;align-items:center;gap:12px}
.switch-row .t{flex:1}
.switch-row b{display:block;font-weight:600;font-size:14.5px;color:var(--fg-strong)}
.switch-row small{color:var(--muted);font-size:12.5px}
.sw{width:52px;height:32px;border-radius:16px;background:var(--line-strong);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{background:var(--mint-text)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.field{width:100%;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--bg);padding:12px 14px;resize:none;min-height:48px}
.sum-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.sum-row.total{font-size:17px;font-weight:700;color:var(--fg-strong);padding-top:8px;border-top:1px dashed var(--line-strong)}
.sum-row .disc{color:var(--mint-text);font-weight:600}

/* статус */
.status-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:4px}
.rings{width:240px;height:240px;position:relative}
.rings svg{width:100%;height:100%;overflow:visible}
.rings .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rings .c small{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rings .c b{font:700 46px/1 var(--f-display);color:var(--fg-strong);letter-spacing:-.01em}
.spin{transform-origin:120px 120px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-hero h2{margin:6px 0 0;font:700 24px/1.15 var(--f-display);color:var(--fg-strong);text-wrap:balance}
.status-hero p{margin:0;color:var(--muted);font-size:14.5px;max-width:30ch}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line-strong)}
.step:last-child::before{display:none}
.step .b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);flex:none;display:grid;place-items:center;z-index:1}
.step.done .b{background:var(--mint-text);border-color:var(--mint-text);color:var(--surface)}
.step.now .b{border-color:var(--mint-text);box-shadow:0 0 0 4px var(--mint-soft)}
.step.now .b::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint-text)}
.step .t b{display:block;font-size:14.5px;font-weight:600;color:var(--fg-strong)}
.step:not(.done):not(.now) .t b{color:var(--muted);font-weight:500}
.step .t small{color:var(--muted);font-size:12.5px}
.pickup{background:var(--sticker);color:var(--on-sticker-2);border-radius:var(--r-l);padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;box-shadow:0 4px 0 var(--edge)}
.pickup small{color:var(--on-sticker);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pickup b{color:#fff;font-size:16px;font-weight:600}
.pickup .shelf{grid-row:1/3;grid-column:2;width:64px;height:64px;border-radius:16px;background:var(--mint);color:#1C2523;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pickup .shelf b{color:#1C2523;font:700 28px/1 var(--f-display)}
.pickup .shelf span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* лояльність */
.loyal{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface);border-radius:var(--r-l);padding:20px 16px;border:1px solid var(--line)}
.loyal svg{width:200px;height:200px}
.loyal h3{margin:0;font:700 20px/1.2 var(--f-display);color:var(--fg-strong)}
.loyal p{margin:0;color:var(--muted);font-size:14px;max-width:32ch}
.hist{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* тост (повідомлення бота) */
.toast{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.35)}
.toast .av{width:36px;height:36px;border-radius:50%;background:var(--sticker);display:grid;place-items:center;flex:none}
.toast .av svg{width:22px;height:22px}
.toast b{display:block;font-size:13px;color:var(--fg-strong)}
.toast span{font-size:13px;color:var(--fg)}
.toast .tx{flex:1;min-width:0}
.toast .undo{flex:none;height:36px;padding:0 12px;border-radius:12px;background:var(--sel-bg);color:var(--sel-fg);font-weight:700;font-size:13px}
.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;color:var(--fg-strong);height:100%}
.search input::placeholder{color:var(--muted)}
.search .clr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.nores{text-align:center;color:var(--muted);padding:24px 8px}
.card .ph{transition:transform .15s var(--ease)}
.card .ph:active{transform:scale(.96)}
.sheet .grab-zone{position:absolute;top:0;left:0;right:64px;height:30px;touch-action:none;cursor:grab;z-index:1}
.hero-disc{touch-action:none;cursor:grab}
.order{position:relative;touch-action:pan-y;user-select:none}
.order .swipe-lbl{position:absolute;top:14px;right:14px;font-weight:700;font-size:13px;color:var(--mint-text);opacity:0;pointer-events:none}
.order.dragging{border-color:var(--mint-text)}
.swipe-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:-8px}
.fly{position:absolute;z-index:50;width:28px;height:28px;border-radius:50%;pointer-events:none}

/* ───── бариста ───── */
.shift{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.shift-top{display:flex;align-items:center;gap:10px}
.shift-top .t{flex:1;min-width:0}
.shift-top h2{margin:0;font:700 20px/1.15 var(--f-display);color:var(--fg-strong)}
.shift-top small{color:var(--muted);font-size:13px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;min-width:0;display:flex;align-items:center;gap:8px;justify-content:space-between}
.ctrl small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.ctrl b{font-size:14px;color:var(--fg-strong)}
.qtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:4px;border-radius:16px;position:sticky;top:0;z-index:4}
.qtabs button{height:42px;border-radius:12px;font-weight:600;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}

.qtabs button[aria-pressed="true"] i{background:var(--sel-bg);color:var(--sel-fg)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:10px}
.order.fresh{border-color:var(--mint-text);box-shadow:0 0 0 3px var(--mint-soft)}
.order-h{display:flex;align-items:center;gap:10px}
.order-h .no{font:700 26px/1 var(--f-display);color:var(--fg-strong)}
.order-h .who{flex:1;min-width:0}
.order-h .who b{display:block;font-weight:600;font-size:14.5px;color:var(--fg-strong)}

.badge{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--mint-soft);color:var(--mint-text);white-space:nowrap}
.badge.amber{background:var(--amber-bg);color:var(--amber-fg)}
.start{display:block;font-size:13px;font-weight:600;color:var(--amber-fg);background:var(--amber-bg);border-radius:12px;padding:8px 10px}
.start.go{background:var(--mint-soft);color:var(--mint-text)}
.olines{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.olines li{display:flex;gap:8px;font-size:14.5px;color:var(--fg-strong);align-items:baseline}
.olines li .q{font-weight:700;min-width:24px}
.olines li em{font-style:normal;display:inline-block;font-size:12.5px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--surface-2);color:var(--fg);margin:2px 4px 0 0}
.olines li em.hl{background:var(--mint-soft);color:var(--mint-text)}
.ocomment{font-size:13.5px;background:var(--amber-bg);color:var(--amber-fg);border-radius:12px;padding:8px 10px}
.btn{height:52px;border-radius:16px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--sticker);color:var(--on-sticker);box-shadow:0 3px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.btn.mint{background:var(--mint);color:#1C2523}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:none;border:1.5px solid var(--line-strong)}
.prod-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.prod-row svg.d{width:44px;height:44px;flex:none}
.prod-row .t{flex:1;min-width:0;text-align:left}
.prod-row b{display:block;font-weight:600;font-size:14.5px;color:var(--fg-strong)}
.prod-row small{color:var(--muted);font-size:12.5px}
.prod-row.off b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi b{display:block;font:700 22px/1.2 var(--f-display);color:var(--fg-strong)}
.kpi span{font-size:12px;font-weight:600;color:var(--mint-text)}
.kpi.wide{grid-column:1/-1;background:var(--sticker);border-color:var(--sticker)}
.kpi.wide small{color:var(--on-sticker-2)}
.kpi.wide b{color:#fff;font-size:30px}
.kpi.wide span{color:var(--on-sticker)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px}
.chart h4{margin:0 0 8px;font-size:14px;color:var(--fg-strong)}
.chart svg{width:100%;height:auto;display:block}
.top-list{display:flex;flex-direction:column;gap:8px}
.top-list .r{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:14px}
.top-list .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.top-list .bar i{display:block;height:100%;background:var(--mint-text);border-radius:3px}
.field-l{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }

/* ───── робочий застосунок ───── */
.app{position:fixed;inset:0;border-radius:0}
.toasts{top:8px}
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:var(--bg)}

.boot .spin-dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--mint-text);animation:wc-spin .9s linear infinite}
@keyframes wc-spin{to{transform:rotate(360deg)}}
.modebar{display:flex;justify-content:flex-end}
.modebar .btn{width:auto;height:44px;padding:0 16px;font-size:14px}
</style>

<div class="app" id="g" hidden aria-label="Wood Coffee">
  <div class="view" id="g-view"></div><div class="dock" id="g-dock"></div><div class="layer" id="g-layer"></div><div class="toasts" id="g-toasts"></div>
</div>
<div class="app" id="a" hidden aria-label="Панель бариста">
  <div class="view" id="a-view"></div><div class="dock" id="a-dock"></div><div class="layer" id="a-layer"></div><div class="toasts" id="a-toasts"></div>
</div>
<script src="config.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>

(() => {
/* ───────── анімації: motion.dev з запасним шляхом на WAAPI ───────── */
const MO = window.Motion && window.Motion.animate ? window.Motion : null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPRING = { type:'spring', stiffness:420, damping:34 };
const SOFT = { type:'spring', stiffness:260, damping:30 };
function toFrames(kf){
  const keys = Object.keys(kf), n = Math.max(...keys.map(k => Array.isArray(kf[k]) ? kf[k].length : 1));
  const frames = [];
  for (let i=0;i<n;i++){ const f = {}; let tr = '';
    keys.forEach(k => { const arr = Array.isArray(kf[k]) ? kf[k] : [kf[k]]; const v = arr[Math.min(i,arr.length-1)];
      if (k==='x') tr += `translateX(${typeof v==='number'?v+'px':v}) `;
      else if (k==='y') tr += `translateY(${typeof v==='number'?v+'px':v}) `;
      else if (k==='scale') tr += `scale(${v}) `;
      else if (k==='rotate') tr += `rotate(${v}deg) `;
      else f[k] = v; });
    if (tr) f.transform = tr.trim(); frames.push(f); }
  return frames;
}
function anim(el, kf, o = {}){
  if (!el || reduce) return null;
  try {
    if (MO) return MO.animate(el, kf, o);
    return el.animate(toFrames(kf), { duration:(o.duration || .38)*1000, delay:(o.delay||0)*1000, easing:'cubic-bezier(.2,.8,.2,1)', fill:'both' });
  } catch(e){ return null; }
}
function staggerIn(nodes, kf = { opacity:[0,1], y:[14,0] }, step = .04){
  [...nodes].forEach((n,i) => anim(n, kf, { ...SOFT, delay: Math.min(i,10)*step }));
}
function countTo(el, to){
  if (!el) return; const from = +el.dataset.v || 0; el.dataset.v = to;
  if (reduce || from === to || !MO) { el.textContent = fmt(to); return; }
  MO.animate(from, to, { duration:.45, ease:[.2,.8,.2,1], onUpdate: v => el.textContent = fmt(Math.round(v)) });
}

/* ───────── дані ───────── */
const fmt = n => n.toLocaleString('uk-UA').replace(/ /g,' ') + ' ₴';
const CATS = [ ['coffee','Кава'], ['tea','Чай'], ['cold','Холодні'], ['dessert','Десерти'] ];
const SZ = [['S','250 мл'],['M','350 мл'],['L','450 мл']];
/* r: кольори кілець ззовні всередину, l: колір ліній зрізу */
let P = [], PI = {}, MILK = [], EXTRA = [];
const GHOST = id => ({ id, cat:'coffee', name:'Позиція з архіву', short:'', desc:'', sizes:[null,null,null], r:['#EAD6BE','#B98559','#7A4B2A'], l:'rgba(60,30,10,.35)', kcal:[0,0,0], compo:'', all:'', vol:null });
const pp = id => PI[id] || GHOST(id);
function applyMenu(m){
  P = m.products.map(p => ({ id:p.id, cat:p.cat, name:p.name, short:p.short, desc:p.descr, sizes:p.sizes, price:p.price, kcal:p.kcal || [], tag:p.tag,
    compo:p.compo, all:p.allergens, r:p.rings, l:p.line, milk:p.milk, vol:p.vol, w:p.weight }));
  PI = Object.fromEntries(P.map(p => [p.id, p]));
  MILK = m.milk; EXTRA = m.extra;
  S.stop = new Set(m.stop || []);
  if (m.location){ S.loc = m.location; S.accepting = m.location.accepting; S.prep = m.location.prep_min; }
}

let me = (() => { try { return Telegram.WebApp.initDataUnsafe.user.first_name; } catch(e){ return null; } })() || 'Гість';
const CFG = window.WOOD || {};
const TW = (() => { try { return window.Telegram && Telegram.WebApp; } catch(e){ return null; } })();
const INIT = (TW && TW.initData) || CFG.devInit || '';
const ERR = { paused:'Кав\'ярня на хвилинку на паузі. Спробуйте трохи згодом.', stopped:'Щось із кошика щойно закінчилось. Меню оновили.',
  too_many_active:'У вас уже три активні замовлення. Заберіть одне, і можна ще.', no_pay:'Онлайн-оплата ще не підключена. Оберіть «При отриманні».',
  pay_failed:'Не вдалося створити оплату. Спробуйте ще раз або оплатіть на касі.', auth:'Відкрийте Wood Coffee через бота в Telegram.',
  forbidden:'Це доступно лише бариста.', empty:'Кошик порожній.', bad_when:'Оберіть, через скільки ви будете.', net:'Немає зв\'язку. Перевірте інтернет.' };
const errText = e => ERR[e && e.code] || 'Щось пішло не так. Спробуйте ще раз.';
async function api(a, data = {}){
  let r;
  try { r = await fetch(CFG.api, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ init:INIT, a, ...data }) }); }
  catch(e){ throw Object.assign(new Error('net'), { code:'net' }); }
  const j = await r.json().catch(() => ({ error:'server' }));
  if (!r.ok || (j && j.error)) throw Object.assign(new Error(j.error || 'server'), { code: j.error || 'server' });
  return j;
}
const greet = () => { const h = +new Intl.DateTimeFormat('uk-UA',{ hour:'numeric', hour12:false, timeZone:'Europe/Kyiv' }).format(new Date()); return h < 5 ? 'Доброї ночі' : h < 12 ? 'Добрий ранок' : h < 18 ? 'Добрий день' : 'Добрий вечір'; };
const dayLbl = t => { const d = new Date(t), n = new Date(); const y = new Date(n - 864e5); const same = (a,b) => a.toDateString() === b.toDateString();
  return (same(d,n) ? 'сьогодні' : same(d,y) ? 'вчора' : d.toLocaleDateString('uk-UA',{ day:'numeric', month:'long' })) + ', ' + hhmm(t); };

const S = {
  mode:'guest', staff:false, payments:false, q:'', spyLock:false, gTab:'menu', gView:'menu', cat:'coffee', aTab:'queue', qTab:'new', accepting:true, prep:6,
  loc:{ name:'Wood Coffee', address:'', hint:'Полиця видачі праворуч від каси' },
  cart:[], when:15, pay:'cash', bonus:true, comment:'', bonusBal:0, stamps:0,
  stop:new Set(), seen:new Set(), myOrder:null, orders:[], history:[], stats:null, busy:false,
};

/* ───────── графіка: зріз дерева = чашка згори ───────── */
let uid = 0;
function disc(p, opts = {}){
  const seed = [...p.id].reduce((a,c) => a + c.charCodeAt(0), 0);
  const isDes = p.cat === 'dessert';
  let s = `<svg class="${opts.cls||''}" viewBox="0 0 100 100" aria-hidden="true">`;
  if (!isDes) s += `<circle cx="50" cy="50" r="49" fill="var(--cup)"/><circle cx="50" cy="50" r="48.4" fill="none" stroke="var(--cup-edge)" stroke-width="1.2"/><circle cx="50" cy="50" r="43.5" fill="none" stroke="var(--cup-edge)" stroke-width=".8"/>`;
  else s += `<circle cx="50" cy="52" r="47" fill="rgba(0,0,0,.08)"/><circle cx="50" cy="50" r="47" fill="var(--cup)"/><circle cx="50" cy="50" r="47" fill="none" stroke="var(--cup-edge)" stroke-width="1"/>`;
  const R0 = isDes ? 38 : 41, n = p.r.length;
  p.r.forEach((c,i) => { s += `<circle cx="50" cy="50" r="${(R0 - i*(R0-12)/n).toFixed(1)}" fill="${c}"/>`; });
  for (let k=0;k<4;k++){
    const rad = 35 - k*8, C = 2*Math.PI*rad, gap = C*(.10 + ((seed+k*7)%5)*.035), rot = (seed*37 + k*101) % 360;
    s += `<circle class="ring" cx="50" cy="50" r="${rad}" fill="none" stroke="${p.l}" stroke-width="${2.4-k*.3}" stroke-linecap="round" stroke-dasharray="${(C-gap).toFixed(1)} ${gap.toFixed(1)}" transform="rotate(${rot} 50 50)"/>`;
  }
  s += `<circle cx="50" cy="50" r="2.8" fill="${p.l}"/></svg>`;
  return s;
}
function logoRing(){ return `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9.5" fill="var(--on-sticker)"/><circle cx="10" cy="10" r="6.6" fill="none" stroke="var(--sticker)" stroke-width="1.6" stroke-dasharray="33 8.5" stroke-linecap="round" transform="rotate(200 10 10)"/><circle cx="10" cy="10" r="3.6" fill="none" stroke="var(--sticker)" stroke-width="1.5" stroke-dasharray="17 5.6" stroke-linecap="round" transform="rotate(40 10 10)"/><circle cx="10" cy="10" r="1.2" fill="var(--sticker)"/></svg>`; }
const LOGO = `<span class="logo" aria-label="Wood Coffee"><span class="top">${logoRing()}</span><span class="l1">W${logoRing()}${logoRing()}D</span><span class="l2">COFFEE</span></span>`;
const I = {
  plus:'<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  minus:'<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',

function ringsSvg(stIdx){

    if (i < doneN) s += `<circle class="rg-done" data-c="${C(r).toFixed(1)}" cx="120" cy="120" r="${r}" fill="none" stroke="var(--mint-text)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C(r).toFixed(1)}" stroke-dashoffset="0" transform="rotate(-90 120 120)"/>`;

}

function setupLazy(){

function dragSheet(layer, onClose){
  const sh = layer.querySelector('.sheet'); if (!sh) return;
  const zones = sh.querySelectorAll('.grab-zone, .hero-disc');
  zones.forEach(z => z.addEventListener('pointerdown', e => {
    const y0 = e.clientY, t0 = performance.now(); let dy = 0; z.setPointerCapture(e.pointerId);
    const scrim = layer.querySelector('.scrim');
    const mv = ev => { dy = Math.max(0, ev.clientY - y0); sh.style.transform = `translateY(${dy}px)`; if (scrim) scrim.style.opacity = String(1 - Math.min(dy/400, .8)); };
    const up = () => { z.removeEventListener('pointermove', mv); z.removeEventListener('pointerup', up); z.removeEventListener('pointercancel', up);
      const v = dy / Math.max(1, performance.now() - t0);
      if (dy > 120 || (v > .6 && dy > 30)){ hap('light'); const an = sh.animate([{ transform:`translateY(${dy}px)` },{ transform:'translateY(110%)' }], { duration:220, easing:'cubic-bezier(.4,0,1,1)', fill:'forwards' }); if (scrim) scrim.animate([{ opacity:scrim.style.opacity||1 },{ opacity:0 }], { duration:200, fill:'forwards' }); an.finished.then(() => { layer.innerHTML=''; onClose && onClose(); }); }
      else { sh.animate([{ transform:`translateY(${dy}px)` },{ transform:'translateY(0)' }], { duration:260, easing:'cubic-bezier(.2,.9,.3,1.2)' }); sh.style.transform = ''; if (scrim) scrim.style.opacity = ''; }
    };
    z.addEventListener('pointermove', mv); z.addEventListener('pointerup', up); z.addEventListener('pointercancel', up);
  }));
}

/* оформлення: справжнє замовлення через сервер */
async function checkout(btn){
  if (!S.cart.length || S.busy) return;
  S.busy = true; btn.disabled = true; btn.innerHTML = `<span>${S.pay==='cash'?'Надсилаємо…':'Готуємо оплату…'}</span>`;
  anim(btn, { scale:[1,.97,1] }, { duration:.4 });
  const items = S.cart.map(c => { const p = pp(c.id); return { id:c.id, size:p.price?null:SZ[c.size][0], milk:c.milk==='Звичайне'?'':c.milk, extras:c.extras, qty:c.qty }; });
  try {
    const r = await api('order', { items, when:S.when, pay:S.pay, bonus:S.bonus && S.bonusBal > 0, comment:S.comment });
    const done = () => { btn.classList.add('mint'); btn.innerHTML = `${I.check}<span>${r.order.status==='pending'?'Оплачуємо…':'Прийнято'}</span>`; hap('ok');
      S.myOrder = r.order; S.cart = []; S.comment = ''; ringsDrawn = 0;
      setTimeout(() => { S.busy = false; S.gTab = 'orders'; S.gView = 'status'; renderG(false, true); refreshGuest(); }, 450); };
    if (r.invoice){
      let opened = false;
      try { TW.openInvoice(r.invoice, st => {
        if (st === 'paid'){ toast(g, 'Оплачено', 'Бариста вже бачить замовлення №' + r.order.no); setTimeout(refreshGuest, 1200); }
        else if (st === 'cancelled' || st === 'failed'){ api('cancel', { id:r.order.id }).catch(()=>{}).finally(refreshGuest); toast(g, 'Оплату скасовано', 'Замовлення не надіслано, кошик можна оформити знову'); }
      }); opened = true; } catch(e){}
      if (!opened){ await api('cancel', { id:r.order.id }).catch(()=>{}); throw Object.assign(new Error('pay_failed'), { code:'pay_failed' }); }
    }
    done();
  } catch(e){
    S.busy = false; toast(g, 'Не вийшло', errText(e)); hap('heavy');
    if (e.code === 'stopped' || e.code === 'paused') await loadMenu();
    renderG(true);
  }
}
async function loadMenu(){ try { applyMenu(await api('menu')); } catch(e){} }
let lastStatus = null;
async function refreshGuest(){
  try {
    const m = await api('my');
    S.bonusBal = m.user.bonus; S.stamps = m.user.stamps;
    S.history = m.history || [];
    const prev = S.myOrder;
    if (m.active) S.myOrder = m.active;
    else if (prev) S.myOrder = S.history.find(h => h.id === prev.id) || { ...prev, status: prev.status==='done' ? 'done' : 'canceled' };
    const o = S.myOrder;
    if (o && lastStatus && lastStatus.id === o.id && lastStatus.status !== o.status){
      const msg = { new:['Прийнято №'+o.no,'Бариста бачить замовлення'], work:['Готуємо №'+o.no,'Бариста вже почав, буде о '+hhmm(o.ready)], ready:['№'+o.no+' на полиці '+o.shelf,'Заберіть без черги, ім\'я на стаканчику'], done:['Смачного!','Дякуємо, що обрали Wood Coffee'] }[o.status];
      if (msg){ toast(g, msg[0], msg[1]); hap(o.status==='ready'?'ok':'light'); }

  if (enter) staggerIn(a.view.querySelector('.view-in').children, { opacity:[0,1], y:[18,0] }, .035);
  a.view.querySelectorAll('.order.fresh').forEach(el => { anim(el, { opacity:[0,1], scale:[.94,1], y:[-12,0] }, SPRING); const o = S.orders.find(x=>x.id==el.dataset.id); if (o) setTimeout(()=>{ o.fresh=false; el.classList.remove('fresh'); }, 2600); });
  if (S.aTab==='stats') a.view.querySelectorAll('.bar').forEach((b,i) => { b.style.transformOrigin = 'center bottom'; b.style.transformBox = 'fill-box'; anim(b, { scaleY:[0,1] }, { ...SOFT, delay:i*.03 }); });
}
function openEdit(id){
  const p = pp(id);
  a.layer.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Редагувати ${p.name}"><div class="grab"></div><div class="grab-zone" aria-hidden="true"></div><button class="close" data-act="close" aria-label="Закрити">${I.x}</button>
   <div class="sheet-body"><div class="hero-disc" style="width:120px;height:120px">${disc(p)}</div>
    <label class="field-l" for="ed-name">Назва<input class="field" id="ed-name" value="${p.name}"></label>
    <label class="field-l" for="ed-short">Короткий опис у картці<input class="field" id="ed-short" value="${p.short}"></label>
    <label class="field-l" for="ed-desc">Повний опис<textarea class="field" id="ed-desc" rows="3">${p.desc}</textarea></label>
    ${p.price ? `<label class="field-l" for="ed-p0">Ціна, ₴<input class="field num" id="ed-p0" inputmode="numeric" value="${p.price}"></label>` : `<div class="field-l">Ціни за об'єм, ₴<div class="price-grid">${SZ.map(([k],i)=>`<input class="field num" id="ed-p${i}" aria-label="Ціна ${k}" inputmode="numeric" placeholder="${k}: немає" value="${p.sizes[i]??''}">`).join('')}</div></div>`}
    <div class="switch-row"><div class="t"><b>Показувати в меню</b><small>вимкніть, коли закінчилось</small></div><button class="sw" role="switch" aria-checked="${!S.stop.has(id)}" data-act="stock" data-id="${id}" aria-label="В наявності"></button></div>
   </div><div class="foot"><button class="btn" data-act="save" data-id="${id}">Зберегти</button></div></div>`;
  anim(a.layer.querySelector('.scrim'), { opacity:[0,1] }, { duration:.25 });
  anim(a.layer.querySelector('.sheet'), { y: MO ? ['100%','0%'] : [600,0] }, SPRING);
  dragSheet(a.layer, () => renderA(true));
}
function advance(id, swiped){
  const o = S.orders.find(x => x.id == id); if (!o) return;
  const next = { new:'work', work:'ready', ready:'done' }[o.status];
  const el = a.view.querySelector(`.order[data-id="${id}"]`);
  const doIt = async () => {
    const prev = o.status; o.status = next; hap(next==='ready'?'ok':'light'); renderA(true);
    try {
      const r = await api('advance', { id:o.id });
      Object.assign(o, r.order);
      if (next === 'ready') toast(a, '№' + o.no + ' на полиці ' + o.shelf, 'Гостю вже написали в бот');
      renderA(true);
    } catch(e){ o.status = prev; renderA(true); toast(a, 'Не вийшло', errText(e)); refreshStaff(); }
  };
  if (el && !reduce && !swiped){ const an = anim(el, { opacity:[1,0], x:[0,60] }, { duration:.22 }); const f = an && (an.finished || an); f && f.then ? f.then(doIt, doIt) : doIt(); } else doIt();
}
let knownIds = null;
function beep(){ try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(), gn = c.createGain(); o.frequency.value = 880; gn.gain.setValueAtTime(.15, c.currentTime); gn.gain.exponentialRampToValueAtTime(.001, c.currentTime + .35); o.connect(gn).connect(c.destination); o.start(); o.stop(c.currentTime + .36); } catch(e){} }
async function refreshStaff(){
  try {
    const q = await api('queue');
    if (q.location){ S.loc = q.location; S.accepting = q.location.accepting; S.prep = q.location.prep_min; }
    const ids = new Set(q.orders.map(o => o.id));
    const fresh = knownIds ? q.orders.filter(o => !knownIds.has(o.id) && o.status === 'new') : [];
    fresh.forEach(o => { o.fresh = true; toast(a, 'Нове замовлення №' + o.no, o.who + ' · буде о ' + hhmm(o.ready)); });
    if (fresh.length){ hap('ok'); beep(); }
    knownIds = ids; S.orders = q.orders;
    if (S.aTab === 'stats') S.stats = await api('stats');
    if (S.mode === 'staff' && !a.layer.innerHTML) renderA(true); else a.dock.innerHTML = aDock();
  } catch(e){}
}

/* свайп картки замовлення вправо = наступний статус */
a.view.addEventListener('pointerdown', e => {
  const card = e.target.closest('.order'); if (!card || e.target.closest('button') || e.button > 0) return;
  const x0 = e.clientX, y0 = e.clientY; let dx = 0, on = false;
  const lbl = card.querySelector('.swipe-lbl');
  const mv = ev => { const ddx = ev.clientX - x0, ddy = ev.clientY - y0;
    if (!on){ if (Math.abs(ddx) > 10 && Math.abs(ddx) > Math.abs(ddy)*1.3){ on = true; card.classList.add('dragging'); try { card.setPointerCapture(e.pointerId); } catch(_){} } else if (Math.abs(ddy) > 10) return cleanup(); else return; }
    dx = Math.max(0, ddx); card.style.transform = `translateX(${dx}px) rotate(${dx/60}deg)`; if (lbl) lbl.style.opacity = String(Math.min(1, dx/100));
    if (dx > 120 && !card.dataset.armed){ card.dataset.armed = 1; hap('light'); } else if (dx <= 120) delete card.dataset.armed; };
  const cleanup = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
  const up = () => { cleanup(); card.classList.remove('dragging');
    if (on && dx > 120){ card.style.transform = ''; card.animate([{ transform:`translateX(${dx}px)`, opacity:1 },{ transform:'translateX(120%)', opacity:0 }], { duration:200, easing:'ease-in', fill:'forwards' }).finished.then(() => advance(card.dataset.id, true)); }
    else if (on){ card.animate([{ transform:`translateX(${dx}px)` },{ transform:'translateX(0)' }], { duration:260, easing:'cubic-bezier(.2,.9,.3,1.25)' }); card.style.transform = ''; if (lbl) lbl.style.opacity = '0'; } };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
});

/* тости: повідомлення бота у чаті */
function toast(app, title, text, action){
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
  t.innerHTML = `<span class="av">${logoRing()}</span><span class="tx"><b>${title}</b><span>${text}</span></span>${action ? `<button class="undo">${action.label}</button>` : ''}`;
  if (action) t.querySelector('.undo').addEventListener('click', () => { action.fn(); t.remove(); });
  app.toasts.appendChild(t);
  anim(t, { opacity:[0,1], y:[-30,0], scale:[.95,1] }, SPRING);
  setTimeout(() => { const an = anim(t, { opacity:[1,0], y:[0,-20] }, { duration:.25 }); const f = an && (an.finished||an); f && f.then ? f.then(()=>t.remove(),()=>t.remove()) : t.remove(); }, 3800);
}

/* ───────── події ───────── */
g.root.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch(act){
    case 'open': if (!S.stop.has(id)) openItem(id); else { openItem(id); } break;
    case 'quick': { const p = pp(id); const si = p.price ? 0 : p.sizes.findIndex(Boolean); addToCart({ id, size:si, milk:p.milk?'Звичайне':'', extras:[], qty:1 }, b); break; }
    case 'close': closeSheet(g.layer); break;
    case 'size': sel.size = +b.dataset.i; paintItem(); hap('light'); countTo(document.getElementById('sheet-sum'), linePrice(sel)*sel.qty); break;
    case 'milk': sel.milk = b.dataset.m; paintItem(); hap('light'); break;
    case 'extra': { const x = b.dataset.e; sel.extras = sel.extras.includes(x) ? sel.extras.filter(y=>y!==x) : [...sel.extras, x]; paintItem(); hap('light'); break; }
    case 'sq': sel.qty = Math.max(1, Math.min(9, sel.qty + +b.dataset.d)); paintItem(); break;
    case 'add': { const it = { ...sel }; const src = g.layer.querySelector('.hero-disc'); const r = src.getBoundingClientRect(); const ghost = document.createElement('div'); ghost.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;pointer-events:none`; document.body.appendChild(ghost); closeSheet(g.layer); setTimeout(() => { addToCart(it, ghost); ghost.remove(); }, 120); break; }
    case 'cat': { S.cat = b.dataset.k; markCat(); S.spyLock = true; setTimeout(() => S.spyLock = false, 700); const sec = g.view.querySelector('#sec-'+S.cat); const cats = g.view.querySelector('.cats'); if (sec) g.view.scrollTo({ top: sec.offsetTop - cats.offsetHeight - 8, behavior: reduce?'auto':'smooth' }); hap('light'); break; }
    case 'go': go(b.dataset.v); break;
    case 'tab': go(b.dataset.v==='orders' && S.myOrder && S.myOrder.status!=='done' ? 'status' : b.dataset.v); S.gTab = b.dataset.v; g.dock.innerHTML = gDock(); break;
    case 'again': { if (!S.accepting) return; const h = S.history[+(b.dataset.i||0)]; if (!h) return; h.items.filter(([iid]) => PI[iid] && !S.stop.has(iid)).forEach(([iid,q,sz,milk,ex]) => { const si = sz ? SZ.findIndex(s=>s[0]===sz) : 0; const same = S.cart.find(c=>c.id===iid&&c.size===si&&c.milk===(milk||'')); same ? same.qty+=q : S.cart.push({ id:iid, size:si, milk:milk||'', extras:ex||[], qty:q }); }); hap('medium'); go('cart'); break; }
    case 'inc': S.cart[+b.dataset.i].qty++; renderG(true); break;
    case 'dec': { const it = S.cart[+b.dataset.i]; it.qty--; if (!it.qty){ const row = b.closest('.line-item'); const an = anim(row, { opacity:[1,0], x:[0,-40] }, { duration:.2 }); const fin = () => { const at = S.cart.indexOf(it); S.cart.splice(at,1); renderG(true); toast(g, 'Прибрали з кошика', pp(it.id).name, { label:'Повернути', fn:() => { it.qty = 1; S.cart.splice(Math.min(at,S.cart.length),0,it); if (S.gView==='cart') renderG(true); else g.dock.innerHTML = gDock(); hap('light'); } }); }; const f = an && (an.finished||an); f && f.then ? f.then(fin,fin) : fin(); } else renderG(true); break; }
    case 'when': S.when = +b.dataset.m; renderG(true); anim(g.view.querySelector('.timeline'), { scale:[.98,1] }, SPRING); hap('light'); break;
    case 'pay': S.pay = b.dataset.k; renderG(true); break;
    case 'bonus': S.bonus = !S.bonus; renderG(true); break;
    case 'checkout': checkout(b); break;
    case 'mode': setMode('staff'); break;
    case 'cancel': if (S.myOrder) api('cancel', { id:S.myOrder.id }).then(() => { toast(g, 'Скасовано', 'Замовлення №' + S.myOrder.no + ' скасовано'); refreshGuest(); }).catch(e => toast(g, 'Не вийшло', errText(e))); break;
    case 'clr': S.q = ''; g.view.querySelector('#q').value = ''; filterMenu(); g.view.querySelector('#q').focus(); break;
    case 'share': { const url = 'https://t.me/share/url?url=' + encodeURIComponent('https://t.me/' + CFG.bot) + '&text=' + encodeURIComponent('Замовляю каву у Wood Coffee наперед і забираю без черги ☕'); try { TW.openTelegramLink(url); } catch(e){ window.open(url, '_blank'); } break; }
  }
});
g.root.addEventListener('input', e => { if (e.target.id === 'cmt') S.comment = e.target.value; if (e.target.id === 'q'){ S.q = e.target.value; filterMenu(); } });

a.root.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch(act){
    case 'qtab': S.qTab = b.dataset.k; renderA(true); staggerIn(a.view.querySelectorAll('#a-list > *')); break;
    case 'adv': advance(b.dataset.id); break;
    case 'mode': setMode('guest'); break;
    case 'accept': S.accepting = !S.accepting; renderA(true); api('location', { accepting:S.accepting }).catch(e => { S.accepting = !S.accepting; renderA(true); toast(a, 'Не вийшло', errText(e)); }); toast(a, S.accepting?'Замовлення увімкнено':'Пауза','' + (S.accepting?'Гості знову можуть замовляти':'Гості бачать, що кав\'ярня на паузі')); break;
    case 'prep': S.prep = Math.max(2, Math.min(20, S.prep + +b.dataset.d)); renderA(true); clearTimeout(window._prepT); window._prepT = setTimeout(() => api('location', { prep:S.prep }).catch(e => toast(a, 'Не вийшло', errText(e))), 500); break;
    case 'atab': S.aTab = b.dataset.v; renderA(false, true); if (S.aTab==='stats') api('stats').then(st => { S.stats = st; if (S.aTab==='stats') renderA(true, true); }).catch(()=>{}); break;
    case 'stock': { const on = S.stop.has(id); on ? S.stop.delete(id) : S.stop.add(id); b.setAttribute('aria-checked', on); if (S.aTab==='menu' && !a.layer.innerHTML) renderA(true); hap('light'); api('stock', { id, on }).then(list => { S.stop = new Set(list); }).catch(e => { toast(a, 'Не вийшло', errText(e)); loadMenu().then(() => renderA(true)); }); break; }
    case 'edit': openEdit(id); break;
    case 'close': closeSheet(a.layer); renderA(true); break;
    case 'save': { const p = pp(id); const v = s => document.getElementById(s)?.value.trim();
      const body = { id, name:v('ed-name'), short:v('ed-short'), descr:v('ed-desc') };
      if (p.price) body.price = +v('ed-p0') || p.price; else body.sizes = [0,1,2].map(i => +v('ed-p'+i) || 0);
      if (!p.price && !body.sizes.some(Boolean)) { toast(a, 'Потрібна хоча б одна ціна', 'Заповніть S, M або L'); break; }
      b.disabled = true;
      api('product', body).then(async () => { await loadMenu(); closeSheet(a.layer); setTimeout(() => renderA(true), 300); toast(a, 'Збережено', pp(id).name + ' оновлено в меню гостя'); })
        .catch(e => { b.disabled = false; toast(a, 'Не вийшло', errText(e)); });
      break; }
  }
});

/* режим: гість або панель бариста (лише для ролі barista/admin) */
function setMode(m){
  if (m === 'staff' && !S.staff) m = 'guest';
  S.mode = m;
  g.root.hidden = m !== 'guest'; a.root.hidden = m !== 'staff';
  if (m === 'staff'){ renderA(false, true); refreshStaff(); } else { renderG(false, true); refreshGuest(); }
  try { location.replace('#' + (m === 'staff' ? 'barista' : 'guest')); } catch(e){}
  hap('light');
}
const root = document.documentElement;

/* Telegram: тема, кнопка «Назад», хаптика */
try {
  const tw = Telegram.WebApp;
  if (tw.platform && tw.platform !== 'unknown'){
    tw.ready(); tw.expand(); tw.disableVerticalSwipes && tw.disableVerticalSwipes();
    root.dataset.theme = tw.colorScheme === 'dark' ? 'dark' : 'light';
    const paint = () => { const bg = getComputedStyle(root).getPropertyValue('--bg').trim(); try { tw.setHeaderColor(bg); tw.setBackgroundColor(bg); tw.setBottomBarColor && tw.setBottomBarColor(bg); } catch(e){} };
    paint(); tw.onEvent('themeChanged', () => { root.dataset.theme = tw.colorScheme === 'dark' ? 'dark' : 'light'; paint(); });
    tw.BackButton.onClick(() => { if (S.mode === 'guest') go('menu'); });
  }
} catch(e){}

/* живі дані: Realtime-пінг від сервера + запасне опитування */
function realtime(topics){
  if (!CFG.supabaseUrl || !CFG.anonKey || !window.supabase) return;
  try {
    const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.anonKey, { auth:{ persistSession:false } });
    if (topics.user) sb.channel(topics.user).on('broadcast', { event:'ping' }, () => refreshGuest()).subscribe();
    if (topics.staff) sb.channel(topics.staff).on('broadcast', { event:'ping' }, () => refreshStaff()).subscribe();
  } catch(e){}
}
setInterval(() => { if (document.hidden) return; S.mode === 'staff' ? refreshStaff() : refreshGuest(); }, 12e3);
setInterval(() => { if (!document.hidden && S.mode === 'guest' && S.gView === 'menu' && !g.layer.innerHTML && !S.q) loadMenu().then(() => { const top = g.view.scrollTop; g.view.querySelectorAll('.card').length && renderG(true); g.view.scrollTop = top; }); }, 60e3);
setInterval(() => { if (S.mode === 'staff' && S.aTab==='queue' && !a.layer.innerHTML) renderA(true); }, 30e3);

async function boot(){
  const box = document.getElementById('boot');
  const fail = (title, text) => { box.innerHTML = `${LOGO}<b>${title}</b><p>${text}</p>${CFG.bot ? `<a class="btn" style="width:auto;padding:0 20px;display:inline-flex;align-items:center;text-decoration:none" href="https://t.me/${CFG.bot}">Відкрити бота</a>` : ''}`; };
  box.innerHTML = `${LOGO}<span class="spin-dot" aria-hidden="true"></span><p>Завантажуємо меню…</p>`;
  if (!CFG.api) return fail('Застосунок ще не налаштовано', 'Заповніть config.js: адресу функції Supabase.');
  if (!INIT) return fail('Відкрийте через Telegram', 'Wood Coffee працює всередині бота: так ми знаємо, кому писати, коли кава готова.');
  try {
    const d = await api('me');
    if (d.me.name) me = d.me.name;
    S.staff = d.me.role === 'barista' || d.me.role === 'admin';
    S.payments = d.payments; S.pay = d.payments ? 'apple' : 'cash';
    S.bonusBal = d.me.bonus; S.stamps = d.me.stamps;
    applyMenu(d.menu);
    S.history = d.my.history || []; S.myOrder = d.my.active || null; lastStatus = S.myOrder ? { id:S.myOrder.id, status:S.myOrder.status } : null;
    if (S.myOrder) { S.gView = 'status'; S.gTab = 'orders'; }
    box.hidden = true;
    const want = location.hash === '#guest' ? 'guest' : (location.hash === '#barista' || S.staff) ? 'staff' : 'guest';
    setMode(want);
    realtime(d.topics);
  } catch(e){ fail('Не вдалося завантажити', errText(e)); }
}
boot();
})();
</script>
