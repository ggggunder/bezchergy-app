<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wood Coffee — замовлення без черги</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --side-1:#155552; --side-2:#0F3F3C; --void:#050C0B;
    --card:#0E1715; --card-2:#13201D; --line:#ffffff12; --line-2:#ffffff22;
    --green:#8EF0B0; --green-dim:#8EF0B033; --copper:#E3A867;
    --ink:#F2F1EC; --muted:#8FA39C; --pill:#F2F1EC;
    --r-xl:28px; --r-l:22px; --r-m:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%}
  body{color:var(--ink);font:15px/1.45 Onest,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(48vw 60vh at 4% 18%,#1F7A72cc 0%,transparent 70%),
      radial-gradient(40vw 55vh at 96% 30%,#C9874A55 0%,transparent 70%),
      radial-gradient(50vw 50vh at 92% 92%,#155552bb 0%,transparent 70%),
      radial-gradient(45vw 45vh at 8% 95%,#0F3F3C 0%,transparent 70%),
      linear-gradient(160deg,#0E3532,#071A18 55%,var(--void)) fixed}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  :focus-visible{outline:2px solid var(--green);outline-offset:3px}
  .app{max-width:560px;margin:0 auto;min-height:100vh;padding:14px 14px calc(110px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#08110Ff2,#060D0Cf5);box-shadow:0 0 0 1px #ffffff14,0 40px 140px #000c}
  @media (max-width:600px){.app{box-shadow:none;background:transparent}}

  /* ---- верх: бренд + навігація-пігулки ---- */
  .top{display:flex;align-items:center;gap:10px}
  .brand{display:flex;flex-direction:column;justify-content:center;padding:8px 18px;border-radius:999px;border:1px solid var(--line-2);background:#0E1715cc;min-height:52px}
  .brand b{font-size:19px;font-weight:600;letter-spacing:-.3px;line-height:1}
  .brand small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:3px}
  .live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .live.off{background:#FF8A70;box-shadow:0 0 8px #FF8A70}
  .circ{width:52px;height:52px;flex:none;border-radius:50%;border:1px solid var(--line-2);background:#0E1715cc;display:grid;place-items:center}
  .circ svg{width:20px;height:20px}
  .circ.light{background:var(--pill);color:#0A0F0E;border-color:var(--pill)}
  .grow{flex:1}
  .nav{display:flex;gap:4px;padding:5px;margin-top:12px;border-radius:999px;border:1px solid var(--line-2);background:#0E1715cc;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:999px;color:#C9D3CF;font-size:14px;white-space:nowrap}
  .nav button svg{width:16px;height:16px}
  .nav button.on{background:var(--pill);color:#0A0F0E;font-weight:600}
  .nav .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--green);color:#06210F;font-size:11px;font-weight:700;display:grid;place-items:center}

  h1{font-size:36px;font-weight:500;letter-spacing:-1.2px;margin:22px 4px 2px;line-height:1.05}
  .sub{color:var(--muted);margin:0 4px 16px;font-size:14px}

  /* ---- картки ---- */
  .card{background:var(--card);border-radius:var(--r-xl);padding:18px;border:1px solid var(--line)}
  .ico{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none}
  .ico svg{width:20px;height:20px}
  .lbl{color:#C9D3CF;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stack{display:grid;gap:10px}

  /* герой: градієнт як на референсі, але в тонах закладу */
  .hero{position:relative;overflow:hidden;background:
      radial-gradient(420px 220px at 15% 120%,#C9874A55,transparent 70%),
      radial-gradient(520px 260px at 90% -30%,#2BB3A066,transparent 70%),
      linear-gradient(120deg,#0F3F3C,#13201D 60%,#1F2A14)}
  .hero .row{display:flex;align-items:flex-start;justify-content:space-between}
  .hero .go{width:46px;height:46px;border-radius:50%;background:var(--pill);color:#0A0F0E;display:grid;place-items:center}
  .hero .go svg{width:18px;height:18px}
  .hero .big{display:flex;align-items:center;gap:14px;margin-top:12px}
  .hero .meta{font-size:13px;color:#DCE5E1;line-height:1.35}
  .meter{height:6px;border-radius:3px;background:#ffffff1f;margin-top:16px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:3px;background:var(--green);box-shadow:0 0 12px var(--green)}

  /* цифри-табло */
  .dm{display:inline-flex;gap:var(--g,4px)}
  .dm .ch{display:grid;grid-template-columns:repeat(5,var(--px,5px));grid-auto-rows:var(--px,5px);gap:1.5px}
  .dm .ch i{border-radius:1px;background:transparent}
  .dm .ch i.f{background:var(--dm,#F2F1EC)}

  /* категорії */
  .cat{display:flex;flex-direction:column;justify-content:space-between;min-height:168px;text-align:left;transition:background .15s,border-color .15s}
  .cat:hover{background:var(--card-2);border-color:var(--line-2)}
  .cat .art{width:64px;height:64px;margin:-4px 0 0 auto}
  .cat .nm{font-size:18px;font-weight:600;letter-spacing:-.3px;margin-top:8px}
  .cat .cnt{color:var(--muted);font-size:13px}

  .repeat{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
  .repeat .t{flex:1;min-width:0}
  .repeat .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .repeat .t small{color:var(--muted);font-size:12px}
  .price{color:var(--copper);font-weight:600;white-space:nowrap}

  /* список товарів */
  .item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 14px 14px 14px}
  .item .thumb{width:62px;height:62px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#8EF0B01f,transparent 70%),#0A1110;border:1px solid var(--line);display:grid;place-items:center;flex:none}
  .item .thumb svg{width:40px;height:40px}
  .item .t{flex:1;min-width:0}
  .item .t b{display:block;font-weight:600;font-size:16px}
  .item .t small{color:var(--muted);font-size:13px}
  .item .in{font-size:12px;color:var(--green);margin-top:2px}

  .ctabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:16px 0 4px;position:sticky;top:8px;z-index:5;padding:5px;
    border-radius:999px;border:1px solid var(--line-2);background:#07100Fb8;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .ctabs::-webkit-scrollbar{display:none}
  .ctabs button{flex:none;padding:9px 16px;border-radius:999px;color:#C9D3CF;font-size:14px}
  .ctabs button.on{background:var(--pill);color:#0A0F0E;border-color:var(--pill);font-weight:600}
  .item{cursor:default}
  .item .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .plus{width:42px;height:42px;border-radius:50%;background:var(--green);color:#06210F;font-size:24px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px #8EF0B033}
  .plus:active{transform:scale(.92)}
  .item .stepper{padding:3px}.item .stepper button{width:32px;height:32px;font-size:18px}.item .stepper span{min-width:20px;font-size:15px}
  .item.in-cart{border-color:#8EF0B055;background:linear-gradient(90deg,#8EF0B00d,transparent 60%),var(--card)}
  .dock .btn.pop{animation:pop .25s}
  @keyframes pop{50%{transform:scale(1.03)}}

  /* картка товару */
  .product .stage{height:220px;border-radius:var(--r-l);display:grid;place-items:center;
    background:radial-gradient(240px 160px at 50% 45%,#8EF0B026,transparent 70%),radial-gradient(300px 200px at 50% 120%,#C9874A33,transparent 70%),#0A1110;border:1px solid var(--line)}
  .product .stage svg{width:130px;height:130px;filter:drop-shadow(0 18px 30px #000a)}
  .product h2{font-size:28px;font-weight:600;letter-spacing:-.6px;margin:16px 2px 2px}
  .product .d{color:var(--muted);margin:0 2px}
  .qtyrow{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
  .stepper{display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;border:1px solid var(--line-2);background:#0A1110}
  .stepper button{width:42px;height:42px;border-radius:50%;font-size:22px;line-height:1;display:grid;place-items:center;background:#ffffff0a}
  .stepper span{min-width:30px;text-align:center;font-size:18px;font-weight:600}

  /* кнопки */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 20px;border-radius:999px;font-weight:600;font-size:16px;background:var(--pill);color:#0A0F0E}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.green{background:var(--green);color:#06210F;box-shadow:0 10px 30px #8EF0B033}
  .btn .sum{margin-left:auto;opacity:.7}
  .ghost{padding:10px 16px;border-radius:999px;border:1px solid var(--line-2);color:#C9D3CF;font-size:14px}

  /* нижня панель кошика */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(532px,calc(100% - 28px));z-index:20}
  .dock .btn{box-shadow:0 14px 40px #000c}
  .dock .n{width:26px;height:26px;border-radius:50%;background:#0A0F0E;color:var(--pill);font-size:13px;display:grid;place-items:center}

  /* кошик */
  .line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:0}
  .line .nm{flex:1;font-weight:500}
  .line .stepper{padding:3px}.line .stepper button{width:32px;height:32px;font-size:18px}.line .stepper span{min-width:22px;font-size:15px}
  .totals{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
  .gift{color:var(--copper);font-size:14px;padding:10px 0 0}
  .seg{display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:999px;border:1px solid var(--line-2);background:#0A1110;margin:2px 0 14px}
  .seg button{padding:10px;border-radius:999px;color:#C9D3CF;font-weight:500}
  .seg button.on{background:var(--pill);color:#0A0F0E;font-weight:600}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .slot{padding:12px 0 9px;border-radius:16px;border:1px solid var(--line-2);background:#0A1110;text-align:center}
  .slot b{display:block;font-weight:600;font-size:15px}
  .slot .load{display:flex;justify-content:center;gap:3px;margin-top:6px}
  .slot .load i{width:5px;height:5px;border-radius:50%;background:#ffffff26}
  .slot .load i.b{background:var(--green)}
  .slot.on{background:var(--pill);color:#0A0F0E;border-color:var(--pill)}
  .slot.on .load i{background:#0A0F0E33}.slot.on .load i.b{background:#0A7A3E}
  .hint{color:var(--muted);font-size:13px;margin:12px 2px 0}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}

  .card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card-title h3{margin:0;font-size:20px;font-weight:500;letter-spacing:-.3px}
  .stamps{display:flex;gap:8px;margin-top:14px}
  .stamps i{flex:1;aspect-ratio:1;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-size:16px}
  .stamps i.on{background:var(--green-dim);border-color:var(--green);box-shadow:0 0 14px #8EF0B033}

  @media (prefers-reduced-motion:no-preference){
    .screen.anim{animation:in .22s ease-out}
    @keyframes in{from{transform:translateY(8px)}to{transform:none}}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><b>Wood Coffee</b><small><span class="live" id="live"></span><span id="liveTxt">приймаємо замовлення</span></small></div>
    <span class="grow"></span>
    <button class="circ" id="backBtn" aria-label="Назад" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  </div>
  <nav class="nav" id="nav">
    <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Меню</button>
    <button data-go="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7h12l-1 12H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Кошик<span class="badge" id="navBadge" hidden></span></button>
    <button data-go="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1 6 2 6-1-4-3-6 1"/></svg>Картка гостя</button>
  </nav>
  <main id="screen"></main>
</div>
<div class="dock" id="dock" hidden><button class="btn" id="dockBtn"><span class="n" id="dockN"></span><span>Кошик</span><span class="sum" id="dockSum"></span></button></div>

<script>
const tg = window.Telegram?.WebApp;
// Деякі версії Telegram кидають помилку на непідтримувані функції — кожен виклик ізольовано
const safe = fn => { try { return fn(); } catch(e){ console.warn("tg:", e && e.message); } };
safe(() => tg?.ready()); safe(() => tg?.expand());
safe(() => tg?.setHeaderColor?.("#0B2422")); safe(() => tg?.setBackgroundColor?.("#050C0B"));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hap = t => safe(() => tg?.HapticFeedback?.impactOccurred?.(t || "light"));
const money = v => `${v} ₴`;

// ---------- дані: від бота в адресі (#d=base64url JSON), інакше демо ----------
function load(){
  const m = location.hash.match(/d=([^&]+)/);
  if (m) try {
    const b = m[1].replace(/-/g,"+").replace(/_/g,"/");
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))));
  } catch(e){}
  const now = new Date(), mk = (h,mi,d=0,free=4) => { const x = new Date(now); x.setDate(x.getDate()+d); x.setHours(h,mi,0,0); return [Math.floor(x/1000), free]; };
  return {
    q: 3, stamps: 4, goal: 6, open: true, demo: true,
    cats: [[1,"Кава","coffee"],[2,"Чай та інше","tea"],[3,"Випічка","bakery"],[4,"Десерти","dessert"],[5,"Сендвічі","sandwich"]],
    items: [[1,1,"Еспресо","Подвійний шот, 40 мл",45],[2,1,"Американо","250 мл",55],[3,1,"Капучино","250 мл, класика",70],[4,1,"Лате","350 мл",75],[5,1,"Флет вайт","250 мл, подвійний шот",80],
            [6,2,"Чай","Чорний або зелений, 400 мл",50],[7,2,"Какао","300 мл",65],[8,2,"Матча лате","300 мл",90],
            [9,3,"Круасан","Вершковий",60],[10,3,"Сирник","Зі сметаною",75],
            [11,4,"Чізкейк","Класичний",95],[12,4,"Макарон","1 шт, різні смаки",40],[13,4,"Тірамісу","Порція",110],
            [14,5,"Сендвіч з куркою","Курка, салат, соус",135],[15,5,"Сендвіч з лососем","Лосось, крем-сир",165],[16,5,"Тост з сиром","Гарячий",90]],
    last: [[3,2],[9,1]],
    slots: [[mk(15,45,0,4),mk(15,50,0,1),mk(15,55,0,3),mk(16,0),mk(16,5,0,2),mk(16,10),mk(16,15),mk(16,20)],
            [mk(8,0,1),mk(8,5,1,2),mk(8,10,1),mk(8,15,1),mk(8,20,1,1),mk(8,25,1),mk(8,30,1),mk(8,35,1)]]
  };
}
const D = load();
const DEMO = !/d=/.test(location.hash);
const CAP = Math.max(4, ...(D.slots||[]).flat().map(s => s[s.length-1]));
D.slots = (D.slots || [[],[]]).map(day => day.map(s => s.length === 2
  ? [s[0], new Date(s[0]*1000).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}), s[1]] : s));
const ITEMS = Object.fromEntries(D.items.map(([id,cat,name,desc,price,photo]) => [id,{id,cat,name,desc,price,photo}]));
const CATS = D.cats.filter(c => D.items.some(i => i[1] === c[0]));
const cart = new Map();
let day = (D.slots[0] || []).length ? 0 : 1, slot = null;
let route = {name:"home"}, history_ = [];

// ---------- ілюстрації ----------
const ART = {
  coffee:'<svg viewBox="0 0 64 64"><path d="M14 26h30v8c0 9-7 15-15 15s-15-6-15-15z" fill="#F2F1EC"/><path d="M44 29h3c4 0 7 3 7 6s-3 7-7 7h-4" fill="none" stroke="#F2F1EC" stroke-width="3.5"/><path d="M17 28h24v3c0 1-1 2-2 2H19c-1 0-2-1-2-2z" fill="#C9874A"/><rect x="10" y="52" width="40" height="3.5" rx="1.75" fill="#C9874A"/><path d="M24 8l6 6-6 6M32 8l6 6-6 6" fill="none" stroke="#8EF0B0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  tea:'<svg viewBox="0 0 64 64"><path d="M22 6c-4 4 4 7 0 12M32 4c-4 4 4 7 0 12M42 6c-4 4 4 7 0 12" fill="none" stroke="#8EF0B0" stroke-width="3" stroke-linecap="round"/><path d="M6 26h52c0 15-12 25-26 25S6 41 6 26z" fill="#F2F1EC"/><ellipse cx="32" cy="26.5" rx="25" ry="3.5" fill="#8CCB6B"/><rect x="20" y="52" width="24" height="3.5" rx="1.75" fill="#C9874A"/></svg>',
  bakery:'<svg viewBox="0 0 64 64"><path d="M4 42C6 26 20 18 32 18s26 8 28 24c-7-3-13-3-15-1-2-6-7-9-13-9s-11 3-13 9c-2-2-8-2-15 1z" fill="#D99A5B"/><path d="M19 41c1-10 7-15 13-15s12 5 13 15" fill="none" stroke="#8E5428" stroke-width="2.5"/><path d="M26 39c1-8 3-10 6-10s5 2 6 10" fill="none" stroke="#8E5428" stroke-width="2.5"/><rect x="10" y="50" width="44" height="3.5" rx="1.75" fill="#8EF0B0"/></svg>',
  dessert:'<svg viewBox="0 0 64 64"><path d="M8 48h48V26L8 36z" fill="#F2F1EC"/><path d="M8 36l48-10v4L8 40z" fill="#C9874A"/><path d="M8 44h48" stroke="#C9874A" stroke-width="2"/><circle cx="46" cy="20" r="5" fill="#E0566B"/><rect x="6" y="51" width="52" height="3.5" rx="1.75" fill="#8EF0B0"/></svg>',
  sandwich:'<svg viewBox="0 0 64 64"><path d="M6 26Q32 10 58 26z" fill="#D99A5B"/><path d="M5 27q5-3 9 0t9 0 9 0 9 0 9 0 9 0v3H5z" fill="#8CCB6B"/><rect x="6" y="30" width="52" height="5" rx="2" fill="#E0566B"/><rect x="5" y="35" width="54" height="4" rx="2" fill="#F2C94C"/><rect x="6" y="39" width="52" height="10" rx="4" fill="#D99A5B"/><rect x="10" y="53" width="44" height="3.5" rx="1.75" fill="#8EF0B0"/></svg>',
  default:'<svg viewBox="0 0 64 64"><path d="M32 8l6 18 18 6-18 6-6 18-6-18-18-6 18-6z" fill="#8EF0B0"/></svg>',
};
const artFor = id => ART[(D.cats.find(c => c[0] === id) || [])[2]] || ART.default;
const I = {
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
  gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/></svg>',
};

// ---------- цифри-табло 5×7 ----------
const FONT = {"0":"01110100011000110001100011000101110","1":"00100011000010000100001000010001110","2":"01110100010000100010001000100011111","3":"11110000010000101110000010000111110","4":"00010001100101010010111110001000010","5":"11111100001111000001000011000101110","6":"00110010001000011110100011000101110","7":"11111000010001000100010000100001000","8":"01110100011000101110100011000101110","9":"01110100011000101111000010001001100"," ":"00000000000000000000000000000000000"};
function dm(text, px=5, color){
  return `<span class="dm" style="--px:${px}px;--g:${Math.round(px*.9)}px${color?`;--dm:${color}`:""}" aria-label="${esc(text)}">${String(text).split("").map(c => {
    const bits = FONT[c] || FONT[" "];
    return `<span class="ch">${[...bits].map(b => `<i class="${b==="1"?"f":""}"></i>`).join("")}</span>`;
  }).join("")}</span>`;
}

// ---------- розрахунки ----------
const count = () => [...cart.values()].reduce((a,b)=>a+b,0);
function totals(){
  const sub = [...cart].reduce((s,[id,q]) => s + ITEMS[id].price*q, 0);
  const gift = D.stamps >= D.goal && cart.size ? Math.min(...[...cart.keys()].map(id => ITEMS[id].price)) : 0;
  return {sub, gift, total: sub - gift};
}
const nearest = () => D.slots[0][0]?.[1] || (D.slots[1][0] ? `завтра ${D.slots[1][0][1]}` : "—");

// ---------- навігація ----------
function go(name, params={}, push=true){
  if (push && route.name !== name) history_.push(route);
  route = {name, ...params};
  render(); window.scrollTo({top:0});
}
function back(){ route = history_.pop() || {name:"home"}; render(); }
safe(() => tg?.BackButton?.onClick?.(back));
$("#backBtn").onclick = back;
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { history_ = []; go(b.dataset.go, {}, false); });
$("#dockBtn").onclick = () => go("cart");

function chrome(){
  const sub = route.name === "cat";
  $("#backBtn").hidden = route.name === "home";
  safe(() => { if (tg?.BackButton) route.name === "home" ? tg.BackButton.hide() : tg.BackButton.show(); });
  document.querySelectorAll("[data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === (sub ? "home" : route.name)));
  const n = count();
  $("#navBadge").hidden = !n; $("#navBadge").textContent = n;
  $("#dock").hidden = !n || route.name === "cart" || D.open === false;
  $("#dockN").textContent = n; $("#dockSum").textContent = money(totals().total);
  $("#live").classList.toggle("off", D.open === false);
  $("#liveTxt").textContent = D.open === false ? "прийом на паузі" : "приймаємо замовлення";
}

// ---------- екрани ----------
const S = {
  home(){
    const last = (D.last || []).filter(([id]) => ITEMS[id]);
    const lastSum = last.reduce((s,[id,q]) => s + ITEMS[id].price*q, 0);
    const busy = Math.min(100, Math.round((D.q / Math.max(CAP,1)) * 100));
    return `
      <h1>Що замовимо?</h1>
      <p class="sub">${new Date().toLocaleDateString("uk-UA",{weekday:"long",day:"numeric",month:"long"})}</p>
      <div class="stack">
        <div class="card hero">
          <div class="row"><span class="ico">${I.clock}</span><button class="go" data-goto="cart" aria-label="До кошика">${I.arrow}</button></div>
          <div class="lbl" style="margin-top:12px">Замовлень у роботі зараз</div>
          <div class="big">${dm(D.q, 6)}<div class="meta">${D.q ? "приготуємо до вашого часу" : "черги немає 🙌"}<br>найближче — <b>${esc(nearest())}</b></div></div>
          <div class="meter"><i style="width:${Math.max(6,busy)}%"></i></div>
        </div>
        ${last.length ? `<button class="card repeat" id="repeat">
            <span class="ico">${I.repeat}</span>
            <span class="t"><small>Як минулого разу</small><span>${esc(last.map(([id,q]) => ITEMS[id].name + (q>1?` ×${q}`:"")).join(" + "))}</span></span>
            <span class="price">${money(lastSum)}</span></button>` : ""}
        <div class="grid2">
          ${CATS.map(([id,name]) => {
            const n = D.items.filter(i => i[1] === id).length;
            return `<button class="card cat" data-cat="${id}"><div class="art">${artFor(id)}</div>
              <div><div class="nm">${esc(name)}</div><div class="cnt">${n} ${n===1?"позиція":n<5?"позиції":"позицій"}</div></div></button>`;
          }).join("")}
        </div>
      </div>`;
  },
  cat({id}){
    const c = D.cats.find(x => x[0] === id);
    const its = D.items.filter(i => i[1] === id);
    return `<div class="ctabs">${CATS.map(([cid,name]) => `<button data-tab="${cid}" class="${cid===id?"on":""}">${esc(name)}</button>`).join("")}</div>
      <h1 style="margin-top:6px">${esc(c[1])}</h1><p class="sub">Натисніть +, щоб додати в кошик</p>
      <div class="stack">${its.map(([iid,,n,d,p]) => {
        const q = cart.get(iid) || 0;
        return `<div class="card item ${q?"in-cart":""}"><span class="thumb">${artFor(id)}</span>
          <span class="t"><b>${esc(n)}</b><small>${esc(d)}</small></span>
          <span class="side"><span class="price">${money(p)}</span>${q
            ? `<span class="stepper"><button data-ci="${iid}" data-d="-1" aria-label="Менше ${esc(n)}">−</button><span>${q}</span><button data-ci="${iid}" data-d="1" aria-label="Більше ${esc(n)}">+</button></span>`
            : `<button class="plus" data-ci="${iid}" data-d="1" aria-label="Додати ${esc(n)}" ${D.open===false?"disabled":""}>+</button>`}</span></div>`;}).join("")}</div>`;
  },
  cart(){
    if (!cart.size) return `<h1>Кошик</h1><div class="card empty">Тут поки порожньо.<br><br><button class="ghost" data-goto="home">Перейти до меню</button></div>`;
    const t = totals(), list = D.slots[day] || [];
    return `<h1>Кошик</h1><p class="sub">Перевірте й оберіть час</p>
      <div class="stack">
        <div class="card">${[...cart].map(([id,q]) => `<div class="line"><span class="nm">${esc(ITEMS[id].name)}</span>
            <span class="stepper"><button data-ci="${id}" data-d="-1" aria-label="Менше">−</button><span>${q}</span><button data-ci="${id}" data-d="1" aria-label="Більше">+</button></span>
            <span class="price" style="min-width:64px;text-align:right">${money(ITEMS[id].price*q)}</span></div>`).join("")}
          ${t.gift ? `<div class="gift">🎁 Подарунок за картку гостя: −${money(t.gift)}</div>` : ""}
          <div class="totals" style="margin-top:14px"><span class="lbl">Разом</span>${dm(t.total, 5, "#E3A867")}</div>
        </div>
        <div class="card">
          <div class="card-title"><h3>Коли заберете?</h3></div>
          <div class="seg"><button data-day="0" class="${day===0?"on":""}">Сьогодні</button><button data-day="1" class="${day===1?"on":""}">Завтра</button></div>
          ${list.length ? `<div class="slots">${list.map(([ts,l,free]) => {
              const used = Math.max(0, CAP - free);
              return `<button class="slot ${slot?.[0]===ts?"on":""}" data-ts="${ts}" data-l="${l}"><b>${l}</b>
                <span class="load">${Array.from({length:Math.min(CAP,6)},(_,i)=>`<i class="${i<used?"b":""}"></i>`).join("")}</span></button>`;}).join("")}</div>
            <p class="hint">Крапки — скільки замовлень уже на цей час. Приготуємо саме до нього, оплата при отриманні.</p>`
          : `<p class="hint">На цей день вільного часу немає.</p>`}
        </div>
        <button class="btn green" id="orderBtn" ${!slot||D.open===false?"disabled":""}>${slot ? `Замовити на ${slot[2]?"завтра ":""}${slot[1]}` : "Оберіть час"}<span class="sum">${money(t.total)}</span></button>
      </div>`;
  },
  card(){
    const n = Math.min(D.stamps, D.goal);
    return `<h1>Картка гостя</h1><p class="sub">Кожне видане замовлення — штамп</p>
      <div class="card hero">
        <div class="row"><span class="ico">${I.gift}</span></div>
        <div class="big" style="margin-top:16px">${dm(`${n}`, 7, "#8EF0B0")}<div class="meta">з ${D.goal}<br>${n >= D.goal ? "наступна позиція — у подарунок 🎁" : `ще ${D.goal-n} — і кава в подарунок`}</div></div>
        <div class="stamps">${Array.from({length:D.goal},(_,i)=>`<i class="${i<n?"on":""}">${i===D.goal-1?"🎁":i<n?"☕":""}</i>`).join("")}</div>
      </div>`;
  },
};

let lastKey = "";
function render(){
  try { renderInner(); } catch(e){
    $("#screen").innerHTML = `<div class="card empty" style="margin-top:20px">Щось пішло не так 😔<br><small>${esc(e && e.message)}</small><br><br>Закрийте й відкрийте меню ще раз.</div>`;
  }
}
function renderInner(){
  const html = (S[route.name] || S.home)(route);
  const key = route.name + ":" + (route.id || "");
  $("#screen").innerHTML = `<div class="screen ${key !== lastKey ? "anim" : ""}">${html}</div>`;
  lastKey = key;
  chrome(); bind();
}
function bind(){
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { hap(); go("cat",{id:+b.dataset.cat}); });
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => go(b.dataset.goto));
  const rep = $("#repeat");
  if (rep) rep.onclick = () => { cart.clear(); (D.last||[]).forEach(([id,q]) => ITEMS[id] && cart.set(id,q)); hap("medium"); go("cart"); };
  document.querySelectorAll("[data-ci]").forEach(b => b.onclick = () => {
    const id = +b.dataset.ci, d = +b.dataset.d, q = (cart.get(id)||0) + d;
    q > 0 ? cart.set(id, Math.min(q, 20)) : cart.delete(id); hap(d > 0 ? "medium" : "light"); render();
    if (d > 0){ const k = $("#dockBtn"); k.classList.remove("pop"); void k.offsetWidth; k.classList.add("pop"); }
  });
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { route = {name:"cat", id:+b.dataset.tab}; hap(); render(); });
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { day = +b.dataset.day; slot = null; render(); });
  document.querySelectorAll("[data-ts]").forEach(b => b.onclick = () => { slot = [+b.dataset.ts, b.dataset.l, day]; hap(); render(); });
  const ord = $("#orderBtn");
  if (ord) ord.onclick = () => {
    const payload = JSON.stringify({v:1, c:[...cart], ts:slot[0]});
    safe(() => tg?.HapticFeedback?.notificationOccurred?.("success"));
    if (tg?.sendData && !DEMO){
      try { tg.sendData(payload); }
      catch(e){ ord.textContent = "Не вдалося надіслати: " + (e && e.message); }
    }
    else { ord.textContent = "Демо: замовлення сформовано ✓"; ord.disabled = true; }
  };
}

if (DEMO && tg?.initData){
  $("#screen").innerHTML = '<div class="card empty" style="margin-top:20px">Відкрийте меню кнопкою «☕ Меню» в чаті з ботом.</div>';
} else render();
</script>
</body>
</html>
